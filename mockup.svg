  <text x="1560" y="172" fill="#c7cfda" font-size="11" font-family="monospace" text-anchor="end">[0.71, 0, 0.71, 0]</text>
  <text x="1204" y="194" fill="#7d8694" font-size="11">zoom</text>
  <text x="1560" y="194" fill="#c7cfda" font-size="11" font-family="monospace" text-anchor="end">1.0×</text>
  <text x="1204" y="216" fill="#7d8694" font-size="11">mode</text>
  <text x="1560" y="216" fill="#c7cfda" font-size="11" font-family="monospace" text-anchor="end">3D projection</text>

  <!-- transition section -->
  <text x="1204" y="252" fill="#9fb6cc" font-size="12" font-weight="600">Transition in</text>
  <text x="1204" y="276" fill="#7d8694" font-size="11">duration</text>
  <rect x="1360" y="266" width="210" height="6" rx="3" fill="#222734"/>
  <rect x="1360" y="266" width="84" height="6" rx="3" fill="#e8743b"/>
  <text x="1455" y="262" fill="#c7cfda" font-size="10">0.8s</text>
  <text x="1204" y="300" fill="#7d8694" font-size="11">easing</text>
  <text x="1560" y="300" fill="#c7cfda" font-size="11" font-family="monospace" text-anchor="end">ease-in-out</text>

  <!-- layers section -->
  <text x="1204" y="338" fill="#9fb6cc" font-size="12" font-weight="600">Layers</text>
  <g font-size="11">
    <rect x="1204" y="350" width="366" height="26" rx="4" fill="#1a1f2a"/>
    <rect x="1212" y="358" width="10" height="10" rx="2" fill="#9fb6cc"/>
    <text x="1232" y="367" fill="#c7cfda">em  (raw EM · zarr)</text>
    <text x="1560" y="367" fill="#7fcf95" text-anchor="end">100%</text>

    <rect x="1204" y="380" width="366" height="26" rx="4" fill="#1a1f2a"/>
    <rect x="1212" y="388" width="10" height="10" rx="2" fill="#e8743b"/>
    <text x="1232" y="397" fill="#c7cfda">mito  (instance seg · precomputed)</text>
    <text x="1560" y="397" fill="#7fcf95" text-anchor="end">90%</text>

    <rect x="1204" y="410" width="366" height="26" rx="4" fill="#1a1f2a"/>
    <rect x="1212" y="418" width="10" height="10" rx="2" fill="#7ad0ff"/>
    <text x="1232" y="427" fill="#c7cfda">er  (mesh)</text>
    <text x="1560" y="427" fill="#6b7280" text-anchor="end">0% (hidden)</text>

    <rect x="1204" y="440" width="366" height="26" rx="4" fill="#1a1f2a"/>
    <rect x="1212" y="448" width="10" height="10" rx="2" fill="#b06be8"/>
    <text x="1232" y="457" fill="#c7cfda">nucleus  (mesh)</text>
    <text x="1560" y="457" fill="#7fcf95" text-anchor="end">100%</text>
  </g>

  <!-- render backend section -->
  <text x="1204" y="500" fill="#9fb6cc" font-size="12" font-weight="600">Render backend</text>
  <rect x="1204" y="512" width="118" height="28" rx="5" fill="#222734" stroke="#333a48"/>
  <text x="1263" y="530" fill="#c7cfda" font-size="11" text-anchor="middle">Neuroglancer</text>
  <rect x="1328" y="512" width="118" height="28" rx="5" fill="#222734" stroke="#333a48"/>
  <text x="1387" y="530" fill="#c7cfda" font-size="11" text-anchor="middle">Blender</text>
  <rect x="1452" y="512" width="118" height="28" rx="5" fill="#2e7d46"/>
  <text x="1511" y="530" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Composite</text>

  <!-- data manifest section -->
  <text x="1204" y="576" fill="#9fb6cc" font-size="12" font-weight="600">Data manifest</text>
  <g font-size="10.5" font-family="monospace" fill="#8a93a2">
    <text x="1204" y="598">voxel size      8 × 8 × 8 nm</text>
    <text x="1204" y="616">volume          24k × 16k × 9k vx</text>
    <text x="1204" y="634">scales          s0 … s6 (multiscale)</text>
    <text x="1204" y="652">segments        12,481 instances</text>
    <text x="1204" y="670">meshes          mito, er, nucleus</text>
  </g>

  <!-- render status -->
  <rect x="1204" y="690" width="366" height="1" fill="#2a2f3a"/>
  <text x="1204" y="716" fill="#9fb6cc" font-size="12" font-weight="600">Render queue</text>
  <rect x="1204" y="728" width="366" height="30" rx="5" fill="#1a1f2a"/>
  <text x="1214" y="747" fill="#c7cfda" font-size="11">composite · 1080p60</text>
  <rect x="1380" y="739" width="150" height="8" rx="4" fill="#222734"/>
  <rect x="1380" y="739" width="96" height="8" rx="4" fill="#e8743b"/>
  <text x="1560" y="747" fill="#ffb86b" font-size="10" text-anchor="end">64%</text>

  <!-- preview output -->
  <rect x="1204" y="772" width="366" height="200" rx="6" fill="#000000" stroke="#2a2f3a"/>
  <ellipse cx="1387" cy="872" rx="120" ry="86" fill="url(#mesh)" transform="rotate(-15 1387 872)"/>
  <ellipse cx="1440" cy="905" rx="46" ry="36" fill="url(#mesh2)" opacity="0.85"/>
  <circle cx="1387" cy="872" r="26" fill="#000" opacity="0.45"/>
  <path d="M1379 860 L1379 884 L1401 872 Z" fill="#ffffff" opacity="0.9"/>
  <text x="1214" y="965" fill="#9fe0ff" font-size="11">output · jrc_mus-salivary-1.mp4</text>
</svg>
