    <!-- KF template via repeated groups -->
    <!-- KF0 selected -->
    <g>
      <rect x="28" y="712" width="150" height="150" rx="6" fill="url(#emvol)" stroke="#e8743b" stroke-width="2.5"/>
      <ellipse cx="80" cy="775" rx="44" ry="32" fill="url(#mesh)"/>
      <rect x="28" y="712" width="150" height="20" rx="6" fill="#000" opacity="0.4"/>
      <text x="36" y="726" fill="#fff" font-size="10" font-weight="600">KF0 · establish</text>
      <text x="36" y="855" fill="#cbd3de" font-size="9.5">orbit 0° · ng</text>
    </g>
    <!-- transition arrow -->
    <text x="190" y="792" fill="#5a6473" font-size="14" text-anchor="middle">→</text>
    <g>
      <rect x="202" y="712" width="150" height="150" rx="6" fill="url(#emvol)" stroke="#333a48"/>
      <ellipse cx="262" cy="780" rx="44" ry="32" fill="url(#mesh)" transform="rotate(40 262 780)"/>
      <rect x="202" y="712" width="150" height="20" rx="6" fill="#000" opacity="0.4"/>
      <text x="210" y="726" fill="#fff" font-size="10" font-weight="600">KF4 · orbit</text>
      <text x="210" y="855" fill="#cbd3de" font-size="9.5">120° · ease-in-out</text>
    </g>
    <text x="364" y="792" fill="#5a6473" font-size="14" text-anchor="middle">→</text>
    <g>
      <rect x="376" y="712" width="150" height="150" rx="6" fill="url(#emvol)" stroke="#333a48"/>
      <ellipse cx="436" cy="780" rx="44" ry="32" fill="url(#mesh)" transform="rotate(220 436 780)"/>
      <ellipse cx="470" cy="800" rx="30" ry="22" fill="url(#mesh2)" opacity="0.6"/>
      <rect x="376" y="712" width="150" height="20" rx="6" fill="#000" opacity="0.4"/>
      <text x="384" y="726" fill="#fff" font-size="10" font-weight="600">KF8 · ER fade-in</text>
      <text x="384" y="855" fill="#cbd3de" font-size="9.5">opacity 0→1 · 1.5s</text>
    </g>
    <text x="538" y="792" fill="#5a6473" font-size="14" text-anchor="middle">→</text>
    <g>
      <rect x="550" y="712" width="150" height="150" rx="6" fill="url(#emvol)" stroke="#333a48"/>
      <ellipse cx="625" cy="788" rx="60" ry="46" fill="url(#mesh)" transform="rotate(330 625 788)"/>
      <ellipse cx="600" cy="775" rx="26" ry="20" fill="#b06be8" opacity="0.8"/>
      <rect x="550" y="712" width="150" height="20" rx="6" fill="#000" opacity="0.4"/>
      <text x="558" y="726" fill="#fff" font-size="10" font-weight="600">KF11 · zoom nuc</text>
      <text x="558" y="855" fill="#cbd3de" font-size="9.5">zoom 2.4× · composite</text>
    </g>
    <text x="712" y="792" fill="#5a6473" font-size="14" text-anchor="middle">→</text>
    <g>
      <rect x="724" y="712" width="150" height="150" rx="6" fill="url(#emvol)" stroke="#333a48"/>
      <ellipse cx="799" cy="788" rx="78" ry="60" fill="#b06be8" opacity="0.85"/>
      <ellipse cx="780" cy="775" rx="30" ry="24" fill="#ffffff" opacity="0.15"/>
      <rect x="724" y="712" width="150" height="20" rx="6" fill="#000" opacity="0.4"/>
      <text x="732" y="726" fill="#fff" font-size="10" font-weight="600">KF13 · nucleus</text>
      <text x="732" y="855" fill="#cbd3de" font-size="9.5">hold · blender hero</text>
    </g>
    <!-- add keyframe card -->
    <g>
      <rect x="898" y="712" width="150" height="150" rx="6" fill="#161922" stroke="#333a48" stroke-dasharray="5 4"/>
      <text x="973" y="795" fill="#5a6473" font-size="34" text-anchor="middle">+</text>
      <text x="973" y="822" fill="#6b7280" font-size="11" text-anchor="middle">capture frame</text>
    </g>
  </g>

  <!-- selected-keyframe inspector (right column, beside timeline) -->
  <rect x="1186" y="60" width="402" height="928" rx="8" fill="url(#panel)" stroke="#2a2f3a"/>
  <text x="1204" y="86" fill="#e9edf3" font-size="14" font-weight="700">Inspector — KF0</text>
  <rect x="1204" y="100" width="366" height="1" fill="#2a2f3a"/>

  <!-- camera section -->
