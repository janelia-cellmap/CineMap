<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CineMap</title>
<style>
  :root { --bg:#0d0f14; --panel:#161922; --line:#2a2f3a; --fg:#e9edf3; --mut:#7d8694; --accent:#e8743b; --green:#2e7d46; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .dot { width:16px;height:16px;border-radius:50%;background:var(--accent); }
  header b { font-size:15px; }
  input, select, button { font:inherit; }
  input, select { background:#0c0d11; border:1px solid var(--line); color:var(--fg); border-radius:5px; padding:5px 8px; }
  button { background:#222734; border:1px solid var(--line); color:var(--fg); border-radius:5px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:#46506280; }
  button.primary { background:var(--green); border-color:transparent; color:#fff; font-weight:600; }
  button.accent { background:var(--accent); border-color:transparent; color:#fff; font-weight:600; }
  .grow { flex:1; }
  main { flex:1; display:flex; min-height:0; }
  .col { display:flex; flex-direction:column; min-width:0; }
  .left { flex:2; border-right:1px solid var(--line); }
  .right { flex:1.1; }
  .chatcol { flex:1.1; border-left:1px solid var(--line); }
  #chat { flex:1; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .bubble { padding:7px 10px; border-radius:8px; font-size:12.5px; max-width:92%; white-space:pre-wrap; line-height:1.4; }
  .bubble.user { background:#243246; align-self:flex-end; }
  .bubble.claude { background:#1d2530; align-self:flex-start; }
  .bubble.tool { background:#161922; align-self:flex-start; color:#8fb7e0; font-family:monospace; font-size:11px; }
  .bubble.err { background:#3a1f1f; align-self:flex-start; color:#e8a0a0; }
  .bubble ul, .bubble ol { margin:4px 0; padding-left:18px; }
  .bubble li { margin:2px 0; }
  .bubble code { background:#0c0d11; padding:1px 4px; border-radius:3px; font-size:11.5px; }
  .bubble pre { background:#0c0d11; padding:6px 8px; border-radius:5px; overflow-x:auto; white-space:pre; margin:4px 0; }
  .bubble a { color:#8fb7e0; }
  .bubble strong { color:#fff; }
  .pane-title { padding:6px 10px; font-size:12px; color:var(--mut); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  iframe { border:0; width:100%; height:100%; background:#000; }
  #ngWrap { flex:1; min-height:0; }
  #preview { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #preview img, #preview video { max-width:100%; max-height:100%; }
  .controls { padding:8px 10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; border-top:1px solid var(--line); }
  .controls label { font-size:12px; color:var(--mut); }
  .controls input:not([type=checkbox]) { width:64px; }
  .controls input[type=checkbox] { width:auto; margin:0 2px 0 0; vertical-align:middle; }
  .controls label.chk { color:var(--fg); }  /* toggle labels read as active controls */
  #bar { height:6px; background:#222734; border-radius:3px; overflow:hidden; }
  #barFill { height:100%; width:0%; background:var(--accent); transition:width .2s; }
  footer { height:200px; border-top:1px solid var(--line); background:#12151c; display:flex; flex-direction:column; }
  #timeline { flex:1; display:flex; gap:8px; padding:10px; overflow-x:auto; }
  .kf { flex:0 0 150px; height:150px; border:1px solid var(--line); border-radius:6px; background:linear-gradient(#1b2430,#10161e); position:relative; padding:6px; font-size:11px; cursor:pointer; }
  .kf:hover { border-color:#5a6473; }
  .kf.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .kf.drop { border-color:#5aff7a; box-shadow:-3px 0 0 #5aff7a; }
  .kf .lbl { cursor:grab; }
  .kf.hasthumb .lbl, .kf.hasthumb .meta { text-shadow:0 1px 3px #000, 0 0 2px #000; }
  .kf.hasthumb .lbl { background:linear-gradient(#000a,#0000); margin:-6px -6px 0; padding:4px 6px; border-radius:6px 6px 0 0; }
  .kf .lbl { font-weight:600; }
  .kf .meta { color:var(--mut); position:absolute; bottom:6px; left:6px; right:6px; }
  .kf .del { position:absolute; top:4px; right:6px; color:var(--mut); cursor:pointer; }
  .msg { font-size:12px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <div class="dot"></div><b>CineMap</b>
  <select id="projectSel" title="open project"><option value="">— projects —</option></select>
  <input id="name" placeholder="new project name" style="width:140px" />
  <input id="dataPath" class="grow" placeholder="neuroglancer state URL"
    value="https://neuroglancer-demo.appspot.com/#!gs://flyem-user-links/short/jrc_mus-salivary/jrc_mus-salivary-1.json" />
  <button class="primary" onclick="createProject()">Create</button>
  <button onclick="exportProject()" title="download this project as a .cinemap.json file">⭳ Export</button>
  <button onclick="document.getElementById('importFile').click()" title="open a saved .cinemap.json">⭱ Import</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importProject(event)" />
  <button id="claudeToggle" class="accent" onclick="toggleClaude()" title="show / hide the Claude director panel">✦ Help me! Claude</button>
  <span id="status" class="msg"></span>
</header>

<main>
  <div class="col left">
    <div class="pane-title">◆ Neuroglancer — scouting
      <button class="accent" onclick="bake()">★ Bake keyframe</button>
      <button onclick="updateFrame()" title="overwrite the selected keyframe with the current Neuroglancer view (camera + layers + segments)">⟳ Update current frame</button>
      <button onclick="addKeyframe()">+ Duplicate last</button>
      <button onclick="document.getElementById('statesFile').click()" title="upload a list of neuroglancer states (one link per line, or a CSV with a state column) — each becomes a keyframe">⭱ Import states</button>
      <input type="file" id="statesFile" accept=".csv,.txt,text/csv,text/plain" style="display:none" onchange="importStates(event)" />
    </div>
    <div id="ngWrap"><iframe id="ng"></iframe></div>
  </div>
  <div class="col right">
    <div class="pane-title">⬡ Render preview</div>
    <div id="preview"><span class="msg">render output appears here</span></div>
    <div class="controls">
      <button onclick="orbit()">Orbit 360°</button>
      <button onclick="sweep()">Sweep z-slice</button>
      <label>w</label><input id="w" value="1280" />
      <label>h</label><input id="h" value="720" />
      <label>fps</label><input id="fps" value="30" />
      <label>samples</label><input id="samples" value="48" />
      <label title="mesh detail multiplier (1 = default ~5M verts/layer). Higher = crisper but more GPU memory; auto-retries lower if it runs out.">detail</label><input id="detail" value="1" style="width:44px" />
      <label class="chk" title="Director: a non-destructive presentation pass that enhances the look WITHOUT changing your neuroglancer data — camera-relative key/fill/rim lighting, publication-quality materials, and subtle depth-of-field on the framed subject. Uncheck for the plain neuroglancer-faithful render."><input id="autoDirect" type="checkbox" checked /> director</label>
      <label title="Mesh LOD strategy: Single = one resolution for the whole shot. Per-frame = coarser when far, finer on close-ups (like neuroglancer; free on orbits). Per-chunk = spatial LOD within a mesh (experimental, currently same as per-frame).">lod
        <select id="lodMode">
          <option value="frame" selected>per-frame</option>
          <option value="single">single</option>
          <option value="chunk">per-chunk (exp)</option>
        </select></label>
      <button id="previewBtn" onclick="startRender('preview')">▷ Preview</button>
      <label title="preview renders at fps ÷ this">1/</label><input id="ratio" value="10" style="width:44px" />
      <button id="cancelBtn" onclick="cancelRender()" style="display:none;background:#7d2e2e;border-color:transparent;color:#fff">■ Cancel</button>
    </div>
    <div class="controls" style="border-top:0"><div id="bar" class="grow"><div id="barFill"></div></div></div>
    <div class="controls" style="border-top:0"><span id="renderMsg" class="msg"></span></div>
  </div>
  <div class="col chatcol" id="chatcol" style="display:none">
    <div class="pane-title">✦ Claude — director</div>
    <div id="keyBar" style="display:none; padding:8px; border-bottom:1px solid var(--line)">
      <div class="msg" style="margin-bottom:6px">🔑 Set your Anthropic API key to enable Claude:</div>
      <div style="display:flex; gap:6px">
        <input id="apiKey" type="password" class="grow" placeholder="sk-ant-…"
          onkeydown="if(event.key==='Enter')saveApiKey()" />
        <button class="accent" onclick="saveApiKey()">Save</button>
      </div>
    </div>
    <div id="chat"></div>
    <div class="controls">
      <input id="chatInput" class="grow" placeholder="Ask Claude to direct a shot…"
        onkeydown="if(event.key==='Enter')sendChat()" />
      <button class="accent" onclick="sendChat()">Send</button>
    </div>
  </div>
</main>

<footer>
  <div class="pane-title">Keyframe timeline — <span id="kfCount" class="msg">0 frames</span>
    <span class="grow"></span>
    <label class="msg" title="3D mesh opacity for the selected frame; lower it to reveal the EM slice + its segmentation">3D meshes</label>
    <input id="meshOp" type="range" min="0" max="1" step="0.05" value="1" style="width:90px"
      onchange="setMeshOpacity()" title="3D mesh opacity (0 = show only the segmented EM slice)" />
    <button id="exportBtn" class="primary" onclick="startRender('export')">⬇ Export video</button>
    <button id="blendBtn" onclick="startRender('blend')" title="bake the whole shot to a self-contained animated .blend (camera, meshes, EM slices; textures packed in)">⬇ Export .blend</button>
  </div>
  <div id="timeline"></div>
</footer>

<script>
let PID = null;
const $ = (id) => document.getElementById(id);
const api = async (m, url, body) => {
  const r = await fetch(url, { method:m, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined });
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.headers.get('content-type')?.includes('json') ? r.json() : r;
};
const setStatus = (s) => $('status').textContent = s;

async function refreshProjects() {
  const list = await api('GET','/api/projects');
  const sel = $('projectSel');
  sel.innerHTML = '<option value="">— projects —</option>' +
    list.map(p => `<option value="${p.id}">${p.name} (${p.keyframes} kf)</option>`).join('');
}
$('projectSel').onchange = async (e) => { if (e.target.value) await openProject(e.target.value); };

async function createProject() {
  setStatus('analyzing dataset…');
  try {
    const p = await api('POST','/api/projects', { name: $('name').value || 'untitled', data_path: $('dataPath').value });
    PID = p.id; await refreshProjects(); $('projectSel').value = PID;
    await loadNg(); renderKeyframes(p); setStatus('project ready: ' + p.manifest.title);
  } catch (e) { setStatus('error: ' + e.message); }
}

function exportProject() {
  if (!PID) { setStatus('open a project first'); return; }
  window.location.href = `/api/projects/${PID}/export`;  // Content-Disposition -> download
}

async function importProject(e) {
  const file = e.target.files[0];
  if (!file) return;
  setStatus('importing…');
  try {
    const data = JSON.parse(await file.text());
    const p = await api('POST', '/api/projects/import', data);
    PID = p.id; await refreshProjects(); $('projectSel').value = PID;
    await loadNg(); renderKeyframes(p);
    setStatus('imported: ' + (p.name || p.id));
  } catch (err) { setStatus('import failed: ' + err.message); }
  e.target.value = '';
}

async function importStates(e) {
  const file = e.target.files[0];
  if (!file) { return; }
  setStatus('importing states…');
  try {
    const text = await file.text();
    let r;
    if (!PID) {
      // no project open -> create one from the first state in the script
      r = await api('POST', '/api/projects/import_states', { text, name: file.name.replace(/\.[^.]+$/, '') });
      PID = r.project.id; await refreshProjects(); $('projectSel').value = PID;
      await loadNg(); renderKeyframes(r.project);
    } else {
      r = await api('POST', `/api/projects/${PID}/keyframes/import_states`, { text });
      await reload();
    }
    let msg = `imported ${r.count} keyframe${r.count === 1 ? '' : 's'}`;
    if (r.errors && r.errors.length) { msg += ` (${r.errors.length} skipped)`; }
    setStatus(msg);
  } catch (err) { setStatus('import states failed: ' + err.message); }
  e.target.value = '';
}

async function openProject(pid) {
  PID = pid; setStatus('opening…');
  await api('POST', `/api/projects/${pid}/open`);
  const p = await api('GET', `/api/projects/${pid}`);
  await loadNg(); renderKeyframes(p); setStatus('opened ' + p.name);
}

async function loadNg() {
  const { ng_url } = await api('GET','/api/ng_url');
  $('ng').src = ng_url;
}

async function reload() { renderKeyframes(await api('GET', `/api/projects/${PID}`)); }

let LAST_KF_ID = null, KF_ORDER = [], THUMB_VER = {};
function renderKeyframes(p) {
  const tl = $('timeline');
  LAST_KF_ID = p.keyframes.length ? p.keyframes[p.keyframes.length - 1].id : null;
  KF_ORDER = p.keyframes.map(k => k.id);
  $('kfCount').textContent = `${p.keyframes.length} frames`;
  tl.innerHTML = p.keyframes.map((k,i) => {
    // versioned URL: stable unless this thumbnail was just re-rendered, so the
    // browser caches it instead of re-decoding every thumbnail on every reload
    const bg = k.thumbnail_path
      ? `background-image:url('/api/projects/${PID}/keyframes/${k.id}/thumbnail?v=${THUMB_VER[k.id]||0}');background-size:cover;background-position:center;`
      : '';
    return `
    <div class="kf${k.thumbnail_path ? ' hasthumb' : ''}" draggable="true" data-id="${k.id}" style="${bg}"
         title="click to view · drag to reorder"
         onclick="gotoKf('${k.id}', this)"
         ondragstart="kfDragStart(event,'${k.id}')"
         ondragover="kfDragOver(event, this)"
         ondragleave="this.classList.remove('drop')"
         ondrop="kfDrop(event,'${k.id}')">
      <span class="del" onclick="event.stopPropagation(); delKf('${k.id}')">✕</span>
      <div class="lbl">⠿ KF${i} · ${k.label||''}</div>
      <div class="meta">${k.slices.map(s=>s.axis+'='+Math.round(s.position_nm)).join(' ')}<br>
        ${k.meshes.map(m=>m.mesh_name).join(',')||'—'}</div>
    </div>`; }).join('') || '<span class="msg" style="padding:10px">no keyframes yet — Bake one from the scouting view</span>';
}

let DRAG_ID = null;
function kfDragStart(e, id) { DRAG_ID = id; e.dataTransfer.effectAllowed = 'move'; }
function kfDragOver(e, el) { e.preventDefault(); el.classList.add('drop'); }
async function kfDrop(e, targetId) {
  e.preventDefault();
  document.querySelectorAll('.kf').forEach(k => k.classList.remove('drop'));
  if (!DRAG_ID || DRAG_ID === targetId) return;
  const ids = KF_ORDER.slice();
  ids.splice(ids.indexOf(DRAG_ID), 1);           // remove dragged
  ids.splice(ids.indexOf(targetId), 0, DRAG_ID); // insert before target
  DRAG_ID = null;
  try { await api('POST', `/api/projects/${PID}/keyframes/reorder`, { order: ids }); reload(); }
  catch (err) { setStatus('reorder failed: ' + err.message); }
}

let ACTIVE_KF = null;
async function gotoKf(id, el) {
  if (!PID) return;
  ACTIVE_KF = id;
  document.querySelectorAll('.kf').forEach(k => k.classList.remove('active'));
  if (el) el.classList.add('active');
  showKeyframeThumb(id);                 // load this frame's rendered image in the preview
  try { await api('POST', `/api/projects/${PID}/keyframes/${id}/goto`); }
  catch (e) { setStatus('goto failed: ' + e.message); }
}

// load a keyframe's saved render into the Blender preview pane (if it has one)
function showKeyframeThumb(id) {
  if (JOB) return;                       // a live render is using the preview
  const img = new Image();
  img.onload = () => { $('preview').innerHTML = ''; $('preview').appendChild(img); };
  img.onerror = () => { $('preview').innerHTML = '<span class="msg">no render yet — Bake or Update to render this frame</span>'; };
  img.src = `/api/projects/${PID}/keyframes/${id}/thumbnail?v=${THUMB_VER[id] || 0}`;
}

// render the single keyframe to a still; show it live and keep it as the frame thumbnail
let THUMB_JOB = null;
async function renderThumbnail(id) {
  if (THUMB_JOB) { api('POST', `/api/renders/${THUMB_JOB}/cancel`).catch(() => {}); }  // don't pile up
  try {
    const { job_id } = await api('POST', `/api/projects/${PID}/keyframes/${id}/thumbnail`);
    THUMB_JOB = job_id;
    attachRender(job_id, () => {
      if (THUMB_JOB === job_id) THUMB_JOB = null;
      THUMB_VER[id] = Date.now();   // bump only this thumbnail's cache version
      reload();
    }, true);
  } catch (e) { setStatus('thumbnail render failed: ' + e.message); }
}

async function setMeshOpacity() {
  const id = ACTIVE_KF || LAST_KF_ID;
  if (!PID || !id) { setStatus('click a keyframe first'); return; }
  await api('POST', `/api/projects/${PID}/keyframes/${id}/mesh_opacity`, { opacity: +$('meshOp').value });
  setStatus(`3D mesh opacity ${$('meshOp').value} — rendering…`);
  renderThumbnail(id);
}

async function updateFrame() {
  if (!PID) { setStatus('create/open a project first'); return; }
  const id = ACTIVE_KF || LAST_KF_ID;
  if (!id) { setStatus('click a keyframe to select it first'); return; }
  try {
    const kf = await api('POST', `/api/projects/${PID}/keyframes/${id}/update_from_ng`);
    const n = kf.meshes.reduce((a, m) => a + (m.segment_ids?.length || 0), 0);
    setStatus(`updated frame from Neuroglancer (camera + ${n} segment(s)) — rendering…`);
    reload();
    renderThumbnail(id);
  } catch (e) { setStatus('update failed: ' + e.message); }
}

async function bake() {
  if (!PID) { setStatus('create/open a project first'); return; }
  try {
    const kf = await api('POST', `/api/projects/${PID}/bake`);
    ACTIVE_KF = kf.id; reload();
    setStatus('baked keyframe — rendering…');
    renderThumbnail(kf.id);
  } catch (e) { setStatus('bake failed: ' + e.message); }
}
function toggleClaude() {
  const open = $('chatcol').style.display === 'none';
  $('chatcol').style.display = open ? 'flex' : 'none';
  $('claudeToggle').textContent = open ? '✦ Bye! Claude' : '✦ Help me! Claude';
}
async function addKeyframe() { if(!PID)return; await api('POST', `/api/projects/${PID}/keyframes`); reload(); }
async function delKf(id)     { await api('DELETE', `/api/projects/${PID}/keyframes/${id}`); reload(); }
async function orbit()       { if(!PID)return; setStatus('adding orbit…'); await api('POST', `/api/projects/${PID}/orbit`, {degrees:360,n:12}); reload(); setStatus('orbit added'); }
async function sweep()       { if(!PID)return; await api('POST', `/api/projects/${PID}/sweep_slice`, {axis:'z',n:12}); reload(); }

let JOB = null;
function renderingUI(on, mode) {
  $('previewBtn').style.display = on ? 'none' : '';
  $('exportBtn').style.display  = on ? 'none' : '';
  $('blendBtn').style.display   = on ? 'none' : '';
  $('cancelBtn').style.display  = on ? '' : 'none';
  $('cancelBtn').textContent = '■ Cancel' + (on && mode ? ' ' + mode : '');
}

// Preview = fast (fps ÷ ratio); Export = full-quality final video. Both stream
// the latest rendered frame into the preview pane, then loop the finished mp4.
// Live preview while a render runs. Show a text placeholder (NOT an empty <img>,
// which browsers draw as a broken-image icon) and only swap in the frame once it
// has actually loaded — so an early 404 (frame not written yet) shows nothing broken.
function liveRenderPlaceholder() { $('preview').innerHTML = '<span class="msg">rendering…</span>'; }
function showLiveFrame(job_id) {
  const img = new Image();
  img.onload = () => { const p = $('preview'); p.innerHTML = ''; p.appendChild(img); };
  // onerror: frame not on disk yet -> keep the placeholder, try again next tick
  img.src = `/api/renders/${job_id}/latest_frame?t=${Date.now()}`;
}

// Render-socket watchdog. The server heartbeats a status every ~0.4s, so a few
// seconds of silence means the connection is dead even if onclose never fired
// (backgrounded/suspended tab, half-open socket) — fire `onStall` so the UI can
// never stay trapped with Preview/Export hidden. Long Blender frames keep the
// heartbeat alive, so this won't false-fire mid-render.
const HEARTBEAT_MS = 6000;
function heartbeat(onStall) {
  let t;
  return {
    kick: () => { clearTimeout(t); t = setTimeout(onStall, HEARTBEAT_MS); },
    stop: () => clearTimeout(t),
  };
}

async function startRender(mode) {
  if (!PID) { setStatus('create/open a project first'); return; }
  let fps = +$('fps').value;
  if (mode === 'preview') {
    const r = Math.max(1, +$('ratio').value || 1);
    fps = Math.max(1, Math.floor(fps / r));
  }
  // Preview is a fast, low-res look (coarse EM + low-voxel meshes); Export/blend
  // use full resolution for the final output.
  const body = { width:+$('w').value, height:+$('h').value, fps, samples:+$('samples').value,
                 draft: mode === 'preview', mesh_detail: +$('detail').value || 1,
                 auto_direct: $('autoDirect').checked, lod_mode: $('lodMode').value };
  if (mode === 'blend') body.export_blend = true;   // bake an animated .blend, no video
  let job_id;
  try { ({ job_id } = await api('POST', `/api/projects/${PID}/render`, body)); }
  catch (e) { setStatus('render failed to start: ' + e.message); return; }
  JOB = job_id; renderingUI(true, mode);
  liveRenderPlaceholder();

  let ended = false, ws;
  const finish = (msg) => {                 // single exit: always frees the controls
    if (ended) return; ended = true; hb.stop();
    if (JOB === job_id) { renderingUI(false); JOB = null; }
    if (msg) setStatus(msg);
    try { ws && ws.close(); } catch (e) {}
  };
  const hb = heartbeat(() => finish('render connection lost — controls restored (it may still be running)'));

  ws = new WebSocket(`ws://${location.host}/api/renders/${job_id}/ws`);
  ws.onmessage = (ev) => {
    hb.kick();
    const s = JSON.parse(ev.data);
    $('barFill').style.width = Math.round((s.progress||0)*100) + '%';
    $('renderMsg').textContent = `${s.status}: ${s.message||''}`;
    // live-update the preview with the most recent rendered frame
    if (s.status === 'running' && (s.message||'').includes('blender] frame')) {
      showLiveFrame(job_id);
    }
    if (['done','error','cancelled','unknown'].includes(s.status)) {
      if (s.status === 'done') showOutput(job_id, s.output);  // loops automatically
      finish();
    }
  };
  ws.onerror = () => finish();
  ws.onclose = () => finish();
  hb.kick();   // arm the watchdog even if the socket never opens
}

async function cancelRender() {
  if (!JOB) return;
  const job = JOB;
  setStatus('cancelling…');
  api('POST', `/api/renders/${job}/cancel`).catch(() => {});  // don't block the button on a slow request
  // guaranteed escape: free the controls even if the backend wedges and never
  // reports a terminal status (the render may keep finishing in the background)
  setTimeout(() => {
    if (JOB === job) {
      renderingUI(false); JOB = null;
      setStatus('render abandoned — controls restored (it may still finish in the background)');
    }
  }, 8000);
}

function showOutput(job_id, out) {
  const prev = $('preview');
  const url = `/api/projects/${PID}/renders/${job_id}/output?t=${Date.now()}`;
  if (out && out.endsWith('.blend')) {            // not previewable — offer the download
    prev.innerHTML = `<span class="msg">.blend ready — <a href="${url}" download style="color:var(--accent)">download scene.blend</a></span>`;
    return;
  }
  prev.innerHTML = (out && out.endsWith('.mp4'))
    ? `<video src="${url}" controls autoplay loop></video>`
    : `<img src="${url}" />`;
}

// ----------------------------- Claude chat -----------------------------
let CHAT_HISTORY = [];
async function checkConfig() {
  try {
    const c = await api('GET', '/api/config');
    $('keyBar').style.display = c.has_anthropic_key ? 'none' : 'block';
  } catch (e) {}
}
async function saveApiKey() {
  const k = $('apiKey').value.trim();
  if (!k) return;
  try {
    await api('POST', '/api/config/anthropic_key', { key: k });
    $('apiKey').value = '';
    $('keyBar').style.display = 'none';
    addBubble('tool', '✓ API key set — Claude is ready');
  } catch (e) { setStatus('could not set key: ' + e.message); }
}
function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  return s;
}
function mdToHtml(text) {
  const lines = (text || '').split('\n');
  let html = '', inCode = false, list = null;
  const closeList = () => { if (list) { html += list === 'ul' ? '</ul>' : '</ol>'; list = null; } };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (!inCode) { closeList(); html += '<pre>'; inCode = true; } else { html += '</pre>'; inCode = false; }
      continue;
    }
    if (inCode) { html += escapeHtml(raw) + '\n'; continue; }
    let m;
    if ((m = raw.match(/^\s*[-*]\s+(.*)/))) {
      if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += '<li>' + inlineMd(m[1]) + '</li>'; continue;
    }
    if ((m = raw.match(/^\s*\d+\.\s+(.*)/))) {
      if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
      html += '<li>' + inlineMd(m[1]) + '</li>'; continue;
    }
    closeList();
    if ((m = raw.match(/^\s*#{1,6}\s+(.*)/))) { html += '<strong>' + inlineMd(m[1]) + '</strong><br>'; continue; }
    html += raw.trim() === '' ? '<br>' : inlineMd(raw) + '<br>';
  }
  closeList(); if (inCode) html += '</pre>';
  return html;
}
function addBubble(cls, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + cls;
  if (cls === 'claude') b.innerHTML = mdToHtml(text);  // render Claude's markdown
  else b.textContent = text;
  $('chat').appendChild(b);
  $('chat').scrollTop = $('chat').scrollHeight;
  return b;
}
async function sendChat() {
  if (!PID) { setStatus('create/open a project first'); return; }
  const inp = $('chatInput');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  addBubble('user', msg);
  const thinking = addBubble('claude', '…thinking');
  try {
    const r = await api('POST', `/api/projects/${PID}/chat`, { message: msg, history: CHAT_HISTORY });
    thinking.remove();
    if (r.error === 'no_api_key' || r.error === 'bad_api_key') { $('keyBar').style.display = 'block'; addBubble('err', r.text); return; }
    (r.actions || []).forEach(a => {
      const res = a.result || {};
      const note = res.added != null ? `+${res.added} kf` : (res.job_id ? 'render started'
        : (res.error ? 'error: ' + res.error : 'ok'));
      addBubble('tool', `↳ ${a.tool}(${JSON.stringify(a.input)}) → ${note}`);
    });
    if (r.text) addBubble('claude', r.text);
    CHAT_HISTORY.push({ role: 'user', content: msg });
    CHAT_HISTORY.push({ role: 'assistant', content: r.text || '(did actions)' });
    if (r.actions && r.actions.length) reload();        // refresh timeline after edits
    if (r.render_job_id) attachRender(r.render_job_id); // show render progress
  } catch (e) {
    thinking.remove();
    addBubble('err', 'error: ' + e.message);
  }
}

// reused by chat-triggered renders & per-frame thumbnails: drive the progress UI
// light=true (per-frame thumbnails) shows live progress in the preview WITHOUT
// hijacking the Preview/Export buttons or the global render state, so the rest of
// the UI stays fully clickable. The socket always restores state on close/error.
function attachRender(job_id, afterDone, light) {
  if (!light) { JOB = job_id; renderingUI(true, 'render'); }
  liveRenderPlaceholder();
  let finished = false;
  const finish = (status, output) => {
    if (finished) return; finished = true; hb.stop();
    if (!light) { renderingUI(false); if (JOB === job_id) JOB = null; }
    if (status === 'done') showOutput(job_id, output);
    if (afterDone) afterDone();
  };
  const hb = heartbeat(() => finish('error'));  // free the UI if the socket goes silent
  let ws;
  try { ws = new WebSocket(`ws://${location.host}/api/renders/${job_id}/ws`); }
  catch (e) { finish('error'); return; }
  ws.onmessage = (ev) => {
    hb.kick();
    const s = JSON.parse(ev.data);
    $('barFill').style.width = Math.round((s.progress || 0) * 100) + '%';
    $('renderMsg').textContent = `${s.status}: ${s.message || ''}`;
    if (s.status === 'running' && (s.message || '').includes('blender] frame')) {
      showLiveFrame(job_id);
    }
    if (['done', 'error', 'cancelled', 'unknown'].includes(s.status)) { finish(s.status, s.output); try { ws.close(); } catch (e) {} }
  };
  ws.onerror = () => finish('error');
  ws.onclose = () => finish('error');   // never leave the UI stuck if the socket drops
  hb.kick();   // arm the watchdog even if the socket never opens
}

refreshProjects();
checkConfig();
</script>
